[project]
name = "voidcode"
version = "0.1.0"
description = "A terminal-based AI coding assistant built from scratch."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "textual>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
voidcode = "void.cli:main"

[tool.voidcode]
stage = "foundation"
